<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>静岡県東部 道路ライブカメラ WebMap</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>道路ライブカメラ WebMap</h1>
        <p>静岡県東部 / v0.4</p>
      </div>

      <div class="summary" aria-live="polite">
        <div><strong id="mapped-count">-</strong><span>地図表示</span></div>
        <div><strong id="inventory-count">76</strong><span>登録カメラ</span></div>
      </div>

      <section class="control-group">
        <label for="base-select">背景地図</label>
        <select id="base-select">
          <option value="pale">地理院 淡色地図</option>
          <option value="std">地理院 標準地図</option>
          <option value="photo">地理院 写真</option>
        </select>
      </section>

      <section class="control-group">
        <label for="provider-select">管理者</label>
        <select id="provider-select">
          <option value="all">すべて</option>
          <option value="静岡県">静岡県</option>
          <option value="国土交通省">国土交通省</option>
          <option value="NEXCO中日本">NEXCO中日本</option>
        </select>
      </section>

      <section class="control-group">
        <label for="area-select">エリア</label>
        <select id="area-select">
          <option value="all">すべて</option>
        </select>
      </section>

      <section class="control-group">
        <label for="search-input">カメラ・路線検索</label>
        <input id="search-input" type="search" placeholder="例: 乙女峠 / 138 / 箱根">
      </section>

      <section class="control-group geojson-import">
        <label for="geojson-input">GeoJSONインポート</label>
        <input id="geojson-input" type="file" accept=".geojson,.json,application/geo+json,application/json">
        <div class="geojson-actions">
          <span id="geojson-info">未読込</span>
          <button id="geojson-clear" type="button" disabled>クリア</button>
        </div>
        <p class="small">ローカルファイルを一時表示します。ページ再読込で消え、サーバーやGitHubには保存しません。</p>
      </section>

      <div class="button-row">
        <button id="terrain-toggle" type="button" aria-pressed="false">3D地形 ON</button>
        <button id="reset-view" type="button">全域表示</button>
      </div>

      <section class="legend-block">
        <h2>凡例</h2>
        <div><span class="legend-color prefecture"></span>オレンジ：静岡県</div>
        <div><span class="legend-color mlit"></span>青：国交省</div>
        <div><span class="legend-color nexco"></span>緑：NEXCO</div>
        <div class="legend-shape-row"><span class="legend-circle-shape"></span>〇：座標位置</div>
        <div class="legend-shape-row"><span class="legend-square-shape"></span>□：近傍</div>
        <div><span class="legend-color imported"></span>紫：インポートGeoJSON</div>
        <p class="small">※ □は距離標・地名・道路線形などから配置した代表位置を含み、カメラ支柱そのものの座標ではない場合があります。NEXCOはiHighwayを開くための代表リンク地点です。</p>
      </section>

      <div id="status" class="status">地図を読み込んでいます…</div>
    </aside>

    <main class="map-wrap">
      <div id="map" aria-label="静岡県東部の道路ライブカメラ地図"></div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
